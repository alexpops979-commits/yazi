<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Yazi</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: #eef2ff;
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(139,92,246,.4) 0%, transparent 55%),
      radial-gradient(120% 120% at 100% 100%, rgba(37,99,235,.4) 0%, transparent 55%),
      #0b1020;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; -webkit-app-region: drag; user-select: none;
  }
  img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 18px 44px rgba(0,0,0,.45); }
  h1 { font-size: 22px; margin: 4px 0 0; letter-spacing: -.02em; }
  .status { font-size: 12.5px; color: #97a3c4; min-height: 18px; text-align: center; }
  .bar { width: 220px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6d5cff, #2f6bff); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  button { -webkit-app-region: no-drag; margin-top: 6px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #eef2ff; padding: 8px 14px; border-radius: 9px; font-size: 12px; font-family: inherit; cursor: pointer; display: none; }
  button:hover { background: rgba(255,255,255,.14); }
</style>
</head>
<body>
  <img src="../build/icon-256.png" alt="Yazi" />
  <h1>Yazi</h1>
  <div class="bar"><span></span></div>
  <div class="status" id="status">Подготовка…</div>
  <button id="setupBtn" type="button">Настройки сервера</button>

  <script>
    const statusEl = document.getElementById('status');
    const setupBtn = document.getElementById('setupBtn');
    window.yazi.onStatus((text) => {
      statusEl.textContent = text;
    });
    setupBtn.addEventListener('click', () => window.yazi.openSetup());
    setTimeout(() => { setupBtn.style.display = 'inline-block'; }, 12000);
  </script>
</body>
</html>
