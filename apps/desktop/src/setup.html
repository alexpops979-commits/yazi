<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Dalmg — настройка</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: rgba(255,255,255,.05);
    --line: rgba(255,255,255,.12);
    --text: #eef2ff;
    --muted: #97a3c4;
    --brand: #6d5cff;
    --brand2: #2f6bff;
    --ok: #34d399;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 100% at 0% 0%, rgba(139,92,246,.35) 0%, transparent 55%),
      radial-gradient(120% 100% at 100% 100%, rgba(37,99,235,.35) 0%, transparent 55%),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    -webkit-user-select: none;
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(15,20,40,.72);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px 26px 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(18px);
  }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .top img { width: 54px; height: 54px; border-radius: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .section { margin-top: 18px; }
  label.field { display: block; margin-bottom: 13px; }
  .label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input[type="text"], input[type="url"] {
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    -webkit-user-select: text;
    user-select: text;
  }
  input:focus { border-color: rgba(109,92,255,.75); box-shadow: 0 0 0 3px rgba(109,92,255,.18); }
  input::placeholder { color: #6b7897; }
  button {
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s, background .15s, opacity .15s;
    white-space: nowrap;
  }
  button:active { transform: translateY(1px); }
  .ghost { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); }
  .ghost:hover { background: rgba(255,255,255,.13); }
  .primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .check { display: flex; align-items: flex-start; gap: 9px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.04); margin-bottom: 13px; }
  .check input { margin: 2px 0 0; accent-color: var(--brand); width: 15px; height: 15px; }
  .check .t { font-size: 13px; }
  .check .h { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .status { min-height: 18px; font-size: 12px; margin-top: 10px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #6b7897; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img src="../build/icon-256.png" alt="Dalmg" />
      <div>
        <h1>Dalmg</h1>
        <div class="sub">Конструктор сайтов · настольное приложение</div>
      </div>
    </div>

    <div class="section">
      <label class="field">
        <span class="label">Адрес приложения</span>
        <div class="row">
          <input id="serverUrl" type="text" placeholder="http://localhost:3002" spellcheck="false" />
          <button class="ghost" id="testBtn" type="button">Проверить</button>
        </div>
        <div class="hint">Локальный сервер или развёрнутая копия платформы (https://app.вашдомен).</div>
      </label>

      <label class="check">
        <input id="launchLocal" type="checkbox" />
        <span>
          <span class="t">Запускать локальный сервер при открытии</span>
          <span class="h">Приложение само выполнит <code>npm run dev</code> в папке проекта и дождётся загрузки.</span>
        </span>
      </label>

      <label class="field" id="dirField">
        <span class="label">Папка проекта</span>
        <div class="row">
          <input id="projectDir" type="text" placeholder="C:\Users\you\dalmg" spellcheck="false" />
          <button class="ghost" id="pickBtn" type="button">Выбрать…</button>
        </div>
      </label>

      <div class="status" id="status"></div>
    </div>

    <div class="actions">
      <button class="ghost" id="cancelBtn" type="button">Отмена</button>
      <button class="primary" id="saveBtn" type="button">Сохранить и открыть</button>
    </div>

    <div class="foot">
      <span><span class="dot"></span> Данные хранятся на вашем сервере</span>
      <span id="version"></span>
    </div>
  </div>

  <script>
    const els = {
      serverUrl: document.getElementById('serverUrl'),
      projectDir: document.getElementById('projectDir'),
      launchLocal: document.getElementById('launchLocal'),
      dirField: document.getElementById('dirField'),
      status: document.getElementById('status'),
      testBtn: document.getElementById('testBtn'),
      pickBtn: document.getElementById('pickBtn'),
      saveBtn: document.getElementById('saveBtn'),
      cancelBtn: document.getElementById('cancelBtn'),
      version: document.getElementById('version'),
    };

    function setStatus(text, tone) {
      els.status.textContent = text || '';
      els.status.className = 'status' + (tone ? ' ' + tone : '');
    }

    function syncDirVisibility() {
      els.dirField.style.opacity = els.launchLocal.checked ? '1' : '.45';
      els.projectDir.disabled = !els.launchLocal.checked;
      els.pickBtn.disabled = !els.launchLocal.checked;
    }

    (async () => {
      const defaults = await window.dalmg.setup.defaults();
      els.serverUrl.value = defaults.serverUrl || '';
      els.projectDir.value = defaults.projectDir || '';
      els.launchLocal.checked = Boolean(defaults.launchLocal);
      els.version.textContent = 'v' + defaults.version;
      syncDirVisibility();
      if (!defaults.projectDir) {
        setStatus('Папка проекта не найдена — укажите её вручную или отключите локальный запуск.', 'err');
      }
    })();

    els.launchLocal.addEventListener('change', syncDirVisibility);

    els.testBtn.addEventListener('click', async () => {
      els.testBtn.disabled = true;
      setStatus('Проверяем…');
      const result = await window.dalmg.setup.test(els.serverUrl.value.trim());
      setStatus(result.message, result.ok ? 'ok' : 'err');
      els.testBtn.disabled = false;
    });

    els.pickBtn.addEventListener('click', async () => {
      const dir = await window.dalmg.setup.pickProjectDir();
      if (dir) els.projectDir.value = dir;
    });

    els.cancelBtn.addEventListener('click', () => window.dalmg.setup.cancel());

    els.saveBtn.addEventListener('click', async () => {
      const serverUrl = els.serverUrl.value.trim();
      if (!/^https?:\/\//i.test(serverUrl)) {
        setStatus('Укажите адрес вида http://localhost:3002', 'err');
        return;
      }
      if (els.launchLocal.checked && !els.projectDir.value.trim()) {
        setStatus('Укажите папку проекта, чтобы запускать сервер автоматически.', 'err');
        return;
      }
      els.saveBtn.disabled = true;
      setStatus('Сохраняем…');
      await window.dalmg.setup.save({
        serverUrl,
        projectDir: els.projectDir.value.trim(),
        launchLocal: els.launchLocal.checked,
      });
    });
  </script>
</body>
</html>
