name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yazi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yazi?schema=public
      SITE_DOMAIN: lvh.me:3002
      APP_HOST: localhost:3002
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      INTERNAL_TOKEN: ci-internal-token
      ADMIN_EMAIL: admin@yazi.dev
      ADMIN_PASSWORD: admin12345
      DEMO_EMAIL: demo@yazi.dev
      DEMO_PASSWORD: demo12345
      # Do not download the Electron runtime in CI
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared packages
        run: npm run build:packages

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema and seed
        run: |
          npm run db:push
          npm run db:seed

      - name: Start API
        run: |
          nohup npm run dev:api > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health > /dev/null; then
              echo "API is up"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/health

      - name: API smoke test
        run: node scripts/smoke.mjs

      - name: Build web
        run: npm run build -w @yazi/web

      - name: Build API
        run: npm run build -w @yazi/api

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          if-no-files-found: ignore
